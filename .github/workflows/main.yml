name: Construir CIRO AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extraer proyecto
        run: |
          unzip -q CIRO_AI_Android_prototipo.zip -d extraido

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construir APK
        run: |
          PROJECT_DIR=$(dirname "$(find extraido -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CIRO-AI-APK
          path: extraido/**/app/build/outputs/apk/debug/*.apk
